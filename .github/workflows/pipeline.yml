name: Market Pipeline & Report Messenger

on:
  schedule:
    - cron: '30 11 * * *' # Runs daily at 5:00 PM IST (11:30 UTC)
  workflow_dispatch:

permissions:
  contents: write  # Crucial: Allows GitHub Actions to push changes back to the repo

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install pandas numpy requests yfinance

      - name: Run Market Messenger Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python Market_messenger.py

      - name: Commit and Push Only Report Text Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # ONLY stage the text report files generated by your script (Excludes stock_market_data.db)
          git add bullish_report.txt bearish_report.txt active_stocks_report.txt consolidated_strategy_report.txt rvol_active_signals_report.txt
          
          git commit -m "chore: auto-update latest market intelligence reports [skip ci]" || echo "No changes to commit"
          git push
