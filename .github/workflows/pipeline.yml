name: Market Pipeline & Report Messenger

on:
  schedule:
    - cron: '30 11 * * *' # Runs daily at 5:00 PM IST (11:30 UTC)
  workflow_dispatch:
  push:
    branches:
      - main  # Change to 'master' if your default branch has that name

permissions:
  contents: write  # Allows GitHub Actions to push changes back to the repo

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install pandas numpy requests yfinance

      - name: Run Market Messenger Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python Market_messenger.py

      - name: Run Confirmed Trend Report Script
        run: |
          python run_confirmed_trend_report.py

      - name: Commit and Push Report Text Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage the text report files generated by your pipeline
          git add confirmed_bullish_bearish_report.txt relevant_active_stocks_report.txt
          
          git commit -m "chore: auto-update market intelligence reports [skip ci]" || echo "No changes to commit"
          git push
